spring.application.name=ticket-api
server.port=8080

# Base PostgreSQL lancee dans Docker (voir docker-compose.yml a la racine)
spring.datasource.url=jdbc:postgresql://localhost:5433/tickets
spring.datasource.username=ticket_user
spring.datasource.password=ticket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
