<main class="page">
  <header class="entete-page">
    <div class="marque">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="2.5" />
          <path d="M15 6v12" stroke-dasharray="2.5 3" />
          <path d="M6.5 10.5h5M6.5 13.5h3.5" />
        </svg>
      </span>

      <div class="titres">
        <h1>Support — Suivi des tickets</h1>
        <p class="sous-titre">Créez les demandes, suivez leur statut, fermez-les d'un clic.</p>
      </div>
    </div>

    <p class="compteur">
      {{ nbOuverts() }} ticket(s) ouvert(s) sur {{ tickets().length }} au total
    </p>
  </header>

  <div class="contenu">
    <div class="colonne-formulaire">
      <app-ticket-form
        [enCours]="creationEnCours()"
        [erreurServeur]="erreurFormulaire()"
        (creer)="creerTicket($event)"
      />
    </div>

    <div class="colonne-liste">
      @if (messageAction()) {
        <p class="alerte" role="alert">{{ messageAction() }}</p>
      }

      <app-ticket-list
        [tickets]="ticketsPage()"
        [chargement]="chargement()"
        [erreur]="erreurChargement()"
        [filtre]="filtre()"
        [tri]="triDate()"
        [page]="page()"
        [nbPages]="nbPages()"
        [premier]="premierAffiche()"
        [dernier]="dernierAffiche()"
        [total]="tickets().length"
        (changerFiltre)="changerFiltre($event)"
        (changerTri)="changerTri($event)"
        (pagePrecedente)="pagePrecedente()"
        (pageSuivante)="pageSuivante()"
        (fermer)="fermerTicket($event)"
        (reessayer)="charger()"
      />
    </div>
  </div>
</main>
