<main class="page">
  <header class="entete-page">
    <h1>Support — Suivi des tickets</h1>
    <p class="compteur">
      {{ nbOuverts() }} ticket(s) ouvert(s) sur {{ tickets().length }} au total
    </p>
  </header>

  <app-ticket-form
    [enCours]="creationEnCours()"
    [erreurServeur]="erreurFormulaire()"
    (creer)="creerTicket($event)"
  />

  @if (messageAction()) {
    <p class="alerte" role="alert">{{ messageAction() }}</p>
  }

  <app-ticket-list
    [tickets]="ticketsPage()"
    [chargement]="chargement()"
    [erreur]="erreurChargement()"
    [filtre]="filtre()"
    [tri]="triDate()"
    [page]="page()"
    [nbPages]="nbPages()"
    [premier]="premierAffiche()"
    [dernier]="dernierAffiche()"
    [total]="tickets().length"
    (changerFiltre)="changerFiltre($event)"
    (changerTri)="changerTri($event)"
    (pagePrecedente)="pagePrecedente()"
    (pageSuivante)="pageSuivante()"
    (fermer)="fermerTicket($event)"
    (reessayer)="charger()"
  />
</main>
