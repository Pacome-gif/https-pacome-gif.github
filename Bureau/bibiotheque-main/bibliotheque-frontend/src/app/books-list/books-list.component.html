<div class="container mt-4">
  <h2>Liste des Livres</h2>
  <div class="table-responsive-wrapper">
    <table class="table table-success table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Copies</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books">
          <td data-label="ID">{{ book.bookId }}</td>
          <td data-label="Nom">{{ book.bookName }}</td>
          <td data-label="Auteur">{{ book.bookAuthor }}</td>
          <td data-label="Genre">{{ book.bookGenre }}</td>
          <td data-label="Copies">{{ book.noOfCopies }}</td>
          <td data-label="Actions">
            <button (click)="bookDetails(book.bookId)" class="btn btn-success btn-sm me-1">Voir</button>
            <button (click)="updateBook(book.bookId)" class="btn btn-info btn-sm me-1">Modifier</button>
            <button (click)="deleteBook(book.bookId)" class="btn btn-danger btn-sm">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
