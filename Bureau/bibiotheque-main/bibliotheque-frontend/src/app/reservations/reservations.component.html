<div class="container mt-4">
  <h2 class="mb-4" style="color: white;">Gestion des Réservations</h2>

  <!-- COMPOSANT FORMULAIRE -->
  <app-reservations-form
    [books]="books"
    [users]="users"
    [formError]="formError"
    [formSuccess]="formSuccess"
    (creer)="onCreerReservation($event)">
  </app-reservations-form>

  <!-- FILTRE PAR STATUT -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-auto">
          <label class="form-label fw-bold">Filtrer par statut :</label>
        </div>
        <div class="col-auto">
          <select class="form-select" [(ngModel)]="filtreStatut" (change)="onFiltreChange()">
            <option value="TOUS">Tous</option>
            <option value="EN_ATTENTE">En attente</option>
            <option value="DISPONIBLE">Disponible</option>
            <option value="ANNULÉE">Annulée</option>
            <option value="EXPIRÉE">Expirée</option>
            <option value="HONORÉE">Honorée</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- COMPOSANT LISTE -->
  <app-reservations-list
    [reservations]="reservations"
    [loading]="loading"
    [error]="error"
    [cancelLoading]="cancelLoading"
    (retry)="onRetry()"
    (annuler)="onAnnulerReservation($event)">
  </app-reservations-list>
</div>
