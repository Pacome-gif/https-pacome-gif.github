<div class="container mt-4 reservations-page">
  <h2 class="mb-4" style="color: #14315c;">{{ 'reservations.title' | translate }}</h2>

  <!-- COMPOSANT FORMULAIRE -->
  <app-reservations-form
    [books]="books"
    [users]="users"
    [formError]="formError"
    [formSuccess]="formSuccess"
    (creer)="onCreerReservation($event)">
  </app-reservations-form>

  <!-- FILTRE PAR STATUT -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-auto">
          <label class="form-label fw-bold">{{ 'reservations.filterLabel' | translate }}</label>
        </div>
        <div class="col-auto">
          <select class="form-select" [(ngModel)]="filtreStatut" (change)="onFiltreChange()">
            <option value="TOUS">{{ 'status.TOUS' | translate }}</option>
            <option value="EN_ATTENTE">{{ 'status.EN_ATTENTE' | translate }}</option>
            <option value="DISPONIBLE">{{ 'status.DISPONIBLE' | translate }}</option>
            <option value="ANNULEE">{{ 'status.ANNULEE' | translate }}</option>
            <option value="EXPIREE">{{ 'status.EXPIREE' | translate }}</option>
            <option value="HONOREE">{{ 'status.HONOREE' | translate }}</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- COMPOSANT LISTE -->
  <app-reservations-list
    [reservations]="reservations"
    [loading]="loading"
    [error]="error"
    [cancelLoading]="cancelLoading"
    (retry)="onRetry()"
    (annuler)="onAnnulerReservation($event)">
  </app-reservations-list>
</div>
