<div class="container mt-4">
  <h2 class="page-title"><lucide-icon name="users" class="w-6 h-6"></lucide-icon> Liste des Utilisateurs</h2>
  <div class="table-responsive-wrapper">
    <table class="table table-success table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Username</th>
          <th>Rôle</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td data-label="ID">{{ user.userId }}</td>
          <td data-label="Nom">{{ user.name }}</td>
          <td data-label="Username">{{ user.username }}</td>
          <td data-label="Rôle">{{ user.role?.[0]?.roleName || '—' }}</td>
          <td data-label="Actions">
            <div *ngIf="user.role?.[0]?.roleName === 'User'">
              <button (click)="userDetails(user.userId)" class="btn btn-success btn-sm me-1 icon-btn">
                <lucide-icon name="eye" class="w-4 h-4"></lucide-icon> Voir
              </button>
            </div>
            <button (click)="updateUser(user.userId)" class="btn btn-info btn-sm icon-btn">
              <lucide-icon name="pencil" class="w-4 h-4"></lucide-icon> Modifier
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
